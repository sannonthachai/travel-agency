<link rel="canonical" href="https://www.takoworldtour.com/tours.html">
<meta property="og:type" content="website">

<meta property="og:site_name" content="Tako Tour">
<meta property="og:title" content="ทัวร์ทั้งหมด | Tako Tour">
<meta property="og:description" content="รวมแพ็กเกจทัวร์ญี่ปุ่น ฝรั่งเศส อิตาลี บาหลี และทัวร์ในประเทศ กระบี่ ภูเก็ต เชียงใหม่ จาก Tako Tour ค้นหาตามปลายทางและเดือนเดินทาง">
<meta property="og:url" content="https://www.takoworldtour.com/tours.html">
<meta property="og:image" content="https://www.takoworldtour.com/assets/img/italy-dolomites.jpg">
<meta name="theme-color" content="#0B1F3A">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="tours">
<div id="site-header"></div>
<main>
  <section class="page-hero">
    <img id="tours-hero-img" src="assets/img/italy-dolomites.jpg" alt="ทะเลสาบในเทือกเขาโดโลมิติ" width="1600" height="900">
    <div class="wrap"><span class="eyebrow" style="color: #FFD5C8;">แพ็กเกจทัวร์</span><h1 id="tours-title">ทัวร์ทั้งหมด</h1><p id="tours-sub">แพ็กเกจทัวร์ในประเทศและต่างประเทศจาก Tako Tour</p></div>
  </section>
  <section class="wrap" style="padding-top: 40px;">
    <nav aria-label="กรองตามปลายทาง" class="chips" id="chips" style="margin-bottom: 20px;"></nav>
    <div class="toolbar">
      <div style="display: flex; flex-wrap: wrap; gap: 12px; flex: 1 1 420px;">
        <div class="field" style="flex: 2 1 240px;"><label for="tour-q" class="sr-only">ชื่อหรือรหัสโปรแกรม</label><input class="input" id="tour-q" type="search" placeholder="ชื่อหรือรหัสโปรแกรม"></div>
        <div class="field" style="flex: 1.5 1 240px;"><span class="label sr-only" id="tour-range-label">ช่วงวันเดินทาง</span><div class="range" data-range data-from="tour-from" data-to="tour-to"><button type="button" class="input range-btn" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="tour-range-label tour-range-label-v"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="range-text" id="tour-range-label-v">เลือกช่วงวันที่</span></button><input type="hidden" id="tour-from"><input type="hidden" id="tour-to"></div></div>
        <div class="field" style="flex: 1 1 170px;"><label for="tour-airline" class="sr-only">สายการบิน</label><select class="input" id="tour-airline"><option value="">ทุกสายการบิน</option></select></div>
        <button type="button" class="btn btn-ghost" id="tour-reset">ล้างตัวกรอง</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
        <span id="tour-count" style="color: var(--muted); font-size: 14px;" aria-live="polite"></span>
        <div class="field"><label for="tour-sort">เรียงตาม</label><select class="input" id="tour-sort"><option value="">แนะนำ</option><option value="price-asc">ราคาต่ำ – สูง</option><option value="price-desc">ราคาสูง – ต่ำ</option><option value="date">วันเดินทางใกล้สุด</option></select></div>
      </div>
    </div>
    <div class="grid grid-tours" id="tour-list"></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
